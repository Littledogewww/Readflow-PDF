<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadFlow PDF</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-card">
    <div class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
          <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.6 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
          <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.6 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
          <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.6 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
        </svg>
        <span class="title">ReadFlow <span class="badge">PDF</span></span>
      </div>
      <div class="status-dot online" role="status" aria-label="服务在线"></div>
    </div>
    
    <div class="divider"></div>

    <div class="stats-container">
      <div class="stat-box" tabindex="0">
        <span class="stat-value" id="vocab-count">0</span>
        <span class="stat-label">已收集词汇</span>
      </div>
      <div class="stat-box" tabindex="0">
        <span class="stat-value" id="today-count">0</span>
        <span class="stat-label">今日新词</span>
      </div>
    </div>

    <div class="quick-actions">
      <button id="btn-open-library" class="btn btn-primary" aria-label="打开书架">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none; flex-shrink: 0;">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>打开书架</span>
        <span class="arrow">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </span>
      </button>
      <button id="btn-open-viewer" class="btn btn-secondary" aria-label="直接打开阅读器">
        <span>打开 PDF 阅读器</span>
      </button>
    </div>

    <div class="settings-summary" tabindex="0" aria-label="取词和语言设置摘要">
      <div class="setting-item">
        <span class="lbl">取词修饰键</span>
        <span class="val" id="summary-key">Alt</span>
      </div>
      <div class="setting-item">
        <span class="lbl">目标语言</span>
        <span class="val" id="summary-lang">中文 (简体)</span>
      </div>
      <div class="setting-item">
        <span class="lbl">启动行为</span>
        <span class="val" id="summary-startup">进入书架</span>
      </div>
    </div>

    <div class="footer">
      <span>ReadFlow PDF v2.0.0 • 顺流阅读，高效记忆</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
