<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadFlow 书架</title>
  <meta name="description" content="ReadFlow PDF 书架 - 您的所有 PDF 文档，一目了然">
  <link rel="stylesheet" href="library.css">
</head>
<body>

  <!-- Header -->
  <header class="lib-header" role="banner">
    <a class="lib-logo" href="#" aria-label="ReadFlow PDF 首页">
      <svg class="lib-logo-icon" viewBox="0 0 24 24" width="24" height="24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.6 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
        <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.6 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
        <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.6 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
      </svg>
      <span class="lib-logo-text">ReadFlow <span class="lib-logo-badge">PDF</span></span>
    </a>

    <div class="lib-search-wrapper" role="search">
      <span class="lib-search-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input id="lib-search-input" class="lib-search" type="search"
             placeholder="搜索书架..." aria-label="搜索书架">
    </div>

    <div class="lib-actions">
      <button id="lib-add-btn" class="lib-btn lib-btn-primary" aria-label="添加 PDF 文件">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>添加文件</span>
      </button>
      <button id="lib-theme-btn" class="lib-btn lib-btn-ghost" aria-label="切换深浅色模式" title="切换主题">
        <svg id="lib-theme-icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="lib-theme-icon-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <button id="lib-settings-btn" class="lib-btn lib-btn-ghost" aria-label="打开设置" title="系统设置">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Book Grid -->
  <main class="lib-main" role="main" id="lib-main">
    <div class="lib-section-header">
      <h1 class="lib-section-title">书架</h1>
      <span class="lib-section-count" id="lib-count">正在加载...</span>
    </div>

    <div id="lib-grid" class="lib-grid" role="list" aria-label="PDF 书架">
      <!-- Book cards injected by JS -->
      <div class="lib-loading" id="lib-loading-state">
        <div class="spinner"></div>
        <span>正在加载书架...</span>
      </div>
    </div>

    <!-- Empty state (hidden by default) -->
    <div class="lib-empty" id="lib-empty-state" style="display:none" role="status">
      <svg class="lib-empty-icon" viewBox="0 0 24 24" width="72" height="72" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <p class="lib-empty-title">书架还是空的</p>
      <p class="lib-empty-sub">将 PDF 文件拖到下方区域，或点击「添加文件」按钮来添加您的第一本书。</p>
      <button id="lib-empty-add-btn" class="lib-btn lib-btn-primary" aria-label="添加您的第一本书">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>添加第一本书</span>
      </button>
    </div>
  </main>

  <!-- Footer Drop Zone -->
  <footer class="lib-footer" id="lib-footer" role="region" aria-label="拖放区域">
    <div class="lib-dropzone-content">
      <svg class="lib-dropzone-icon" viewBox="0 0 24 24" width="28" height="28" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </svg>
      <span class="lib-dropzone-text">拖拽 PDF 到这里</span>
      <span class="lib-dropzone-sub">或点击「添加文件」选择文件</span>
    </div>
  </footer>

  <!-- Full-screen drag overlay -->
  <div class="lib-drag-overlay" id="lib-drag-overlay" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--primary)" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="17 8 12 3 7 8"></polyline>
      <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
    <p class="lib-drag-overlay-text">松开以添加到书架</p>
  </div>

  <!-- Context Menu (injected dynamically) -->

  <!-- Toast -->
  <div class="lib-toast" id="lib-toast" role="alert" aria-live="polite"></div>

  <!-- Hidden file input -->
  <input type="file" id="lib-file-input" accept=".pdf" multiple style="display:none"
         aria-label="选择 PDF 文件">

  <!-- Settings Drawer -->
  <div id="lib-settings-drawer" class="lib-drawer" aria-hidden="true">
    <div class="lib-drawer-backdrop"></div>
    <div class="lib-drawer-content">
      <div class="lib-drawer-header">
        <h2>全局设置</h2>
        <button id="lib-drawer-close-btn" class="lib-drawer-close" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="lib-drawer-body">
        <div class="settings-group">
          <h3>取词与快捷键</h3>
          <div class="setting-row">
            <label for="setting-modifier">快捷修饰键</label>
            <select id="setting-modifier" class="setting-select">
              <option value="Alt">Alt 键 (推荐)</option>
              <option value="Ctrl">Ctrl 键</option>
              <option value="Shift">Shift 键</option>
              <option value="None">无 (直接选词)</option>
            </select>
          </div>
          <div class="setting-row" style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between;">
            <label for="setting-always-translate">无修饰键直接选词</label>
            <input type="checkbox" id="setting-always-translate" class="setting-checkbox" style="cursor: pointer;">
          </div>
          <p class="setting-help">按住修饰键并双击单词或划选文本将触发收集。</p>
        </div>

        <div class="settings-group">
          <h3>翻译设置</h3>
          <div class="setting-row">
            <label for="setting-lang">目标翻译语言</label>
            <select id="setting-lang" class="setting-select">
              <option value="zh-CN">中文 (简体)</option>
              <option value="zh-TW">中文 (繁体)</option>
              <option value="en">English (Definitions)</option>
              <option value="es">Español</option>
              <option value="ja">日本語</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="setting-provider">翻译服务商</label>
            <select id="setting-provider" class="setting-select">
              <option value="google">Google 翻译 (内置)</option>
              <option value="dictionary">英汉/英英词典 (仅英文)</option>
              <option value="gemini">Gemini AI (上下文翻译)</option>
              <option value="custom-ai">🔧 自定义 AI 接口</option>
            </select>
          </div>
        </div>

        <div id="ai-settings-group" class="settings-group" style="display: none;">
          <h3>Gemini AI 配置</h3>
          <div class="setting-row column">
            <label for="setting-ai-key">Gemini API Key</label>
            <input type="password" id="setting-ai-key" placeholder="输入 API 密钥..." class="setting-input-text">
          </div>
          <div class="setting-row">
            <label for="setting-ai-model">AI 模型</label>
            <select id="setting-ai-model" class="setting-select">
              <option value="gemini-1.5-flash">Gemini 1.5 Flash (推荐)</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            </select>
          </div>
        </div>

        <div id="custom-ai-settings-group" class="settings-group" style="display: none;">
          <h3>🔧 自定义 AI 接口</h3>
          <div class="setting-row">
            <label for="setting-custom-ai-preset">服务商预设</label>
            <select id="setting-custom-ai-preset" class="setting-select">
              <option value="">自定义</option>
              <option value="deepseek">DeepSeek</option>
              <option value="qwen">阿里百炼 (Qwen)</option>
              <option value="moonshot">Moonshot (Kimi)</option>
              <option value="openrouter">OpenRouter</option>
              <option value="ollama">Ollama (本地)</option>
            </select>
          </div>
          <div class="setting-row column">
            <label for="setting-custom-ai-url">Base URL</label>
            <input type="text" id="setting-custom-ai-url" placeholder="https://api.deepseek.com/v1" class="setting-input-text">
          </div>
          <div class="setting-row column">
            <label for="setting-custom-ai-key">API Key</label>
            <input type="password" id="setting-custom-ai-key" placeholder="sk-..." class="setting-input-text">
          </div>
          <div class="setting-row column">
            <label for="setting-custom-ai-model">模型名称</label>
            <input type="text" id="setting-custom-ai-model" placeholder="deepseek-chat" class="setting-input-text">
          </div>
          <div class="setting-row column">
            <label for="setting-custom-ai-prompt">Prompt 模板</label>
            <textarea id="setting-custom-ai-prompt" class="setting-textarea" rows="4"></textarea>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
            <button id="btn-test-custom-ai" class="setting-btn">🔍 测试连接</button>
            <span id="custom-ai-test-result" class="setting-help" style="margin: 0; font-weight: 600;"></span>
          </div>
        </div>

        <div class="settings-group">
          <h3>外观与主题色</h3>
          <div class="setting-row">
            <label for="setting-theme">界面主题</label>
            <select id="setting-theme" class="setting-select">
              <option value="light">明亮纸张</option>
              <option value="dark">暗黑界面</option>
            </select>
          </div>
          <div style="margin-top: 14px;">
            <label style="font-size: 12px; font-weight: 600; color: var(--text-sub); display: block; margin-bottom: 8px;">主题色调</label>
            <div class="color-swatches" id="color-swatches">
              <button class="color-swatch" data-hue="20" title="橙红 (默认)" style="background:hsl(20,75%,48%)"></button>
              <button class="color-swatch" data-hue="225" title="靛蓝" style="background:hsl(225,70%,50%)"></button>
              <button class="color-swatch" data-hue="152" title="翡翠绿" style="background:hsl(152,60%,40%)"></button>
              <button class="color-swatch" data-hue="345" title="玫瑰红" style="background:hsl(345,72%,48%)"></button>
              <button class="color-swatch" data-hue="195" title="青蓝" style="background:hsl(195,78%,42%)"></button>
              <button class="color-swatch" data-hue="40" title="琥珀金" style="background:hsl(40,88%,45%)"></button>
              <button class="color-swatch" data-hue="270" title="紫罗兰" style="background:hsl(270,58%,50%)"></button>
              <button class="color-swatch" data-hue="215" title="深蓝灰" style="background:hsl(215,32%,45%)"></button>
            </div>
            <div style="margin-top: 10px;">
              <input type="range" id="setting-accent-hue" min="0" max="360" step="1" value="20" class="hue-slider">
            </div>
          </div>
          <div class="setting-row" style="margin-top: 12px;">
            <label for="setting-card-mode">卡片展示模式</label>
            <select id="setting-card-mode" class="setting-select">
              <option value="minimal">极简模式 (仅释义)</option>
              <option value="contextual">上下文模式 (释义+例句)</option>
              <option value="full">完整模式 (展示来源及详情)</option>
            </select>
          </div>
        </div>

        <div class="settings-group">
          <h3>启动行为</h3>
          <div class="setting-row">
            <label for="setting-startup-behavior">打开阅读器时</label>
            <select id="setting-startup-behavior" class="setting-select">
              <option value="library">进入书架界面</option>
              <option value="reopen">重新打开上次文件</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="library.js"></script>
</body>
</html>
